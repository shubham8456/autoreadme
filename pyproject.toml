[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoreadme"
version = "0.1.0"
description = "Generate README files for local git repositories using Docker and Ollama"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Shubham Rawat" }
]
dependencies = [
  "requests>=2.32.0",
  "pathspec>=0.12.1"
]

[tool.setuptools]
packages = ["app", "app.core", "app.ollama"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.txt"]
